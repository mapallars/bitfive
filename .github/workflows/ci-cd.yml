# ============================================================
#  CI/CD Pipeline — bitfive monorepo
#  Backend : /api  (TypeScript / Node.js)  → Render
#  Frontend: /app  (JavaScript / React)    → Vercel
#
#  Jobs CI (sin cambios)
#  ├── lint             → matrix: [backend, frontend]
#  ├── build            → matrix: [backend, frontend]
#  ├── dependency-audit → matrix: [backend, frontend]
#  └── semgrep          → SAST dividido por path
#
#  Jobs CD (nuevos)
#  ├── deploy-frontend  → Vercel production
#  ├── deploy-backend   → Render production
#  └── smoke-test       → verificación post-deploy
#
#  Política de despliegue
#  └── Solo producción (main). Un único ambiente.
#      El CD se activa de dos formas:
#        a) push a main (automático, después de que CI pase)
#        b) workflow_dispatch (manual, desde la UI de GitHub Actions)
#
#  Secrets requeridos (Settings → Secrets → Actions):
#  ├── VERCEL_TOKEN          : token de la cuenta Vercel
#  ├── VERCEL_ORG_ID         : org ID del proyecto Vercel
#  ├── VERCEL_PROJECT_ID     : project ID del proyecto Vercel
#  ├── RENDER_DEPLOY_HOOK_URL: webhook URL del servicio Render (producción)
#  └── BACKEND_PROD_URL      : URL pública del backend en Render
# ============================================================

name: CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "release/*"
      - "hotfix/*"
  pull_request:
    branches:
      - main
      - develop

  # ── Disparo manual desde GitHub Actions UI ──────────────────
  # Permite ejecutar el CD en cualquier momento sobre main,
  # sin necesidad de hacer un push. Útil para rollbacks rápidos
  # o redespliegues tras un incidente.
  workflow_dispatch:
    inputs:
      reason:
        description: "Motivo del despliegue manual"
        required: false
        default: "Redespliegue manual"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 20

jobs:
  # ----------------------------------------------------------
  # 1. LINT
  # ----------------------------------------------------------
  lint:
    name: "Lint · ${{ matrix.name }}"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            path: api
            lang: typescript
          - name: frontend
            path: app
            lang: javascript

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript type-check
        if: matrix.lang == 'typescript'
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint --if-present

  # ----------------------------------------------------------
  # 2. BUILD
  # ----------------------------------------------------------
  build:
    name: "Build · ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: lint
    if: needs.lint.result == 'success' || needs.lint.result == 'failure'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            path: api
            artifact: backend-dist
            dist: api/dist
          - name: frontend
            path: app
            artifact: frontend-dist
            dist: app/dist

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.dist }}
          retention-days: 3

  # ----------------------------------------------------------
  # 3. ANÁLISIS DE DEPENDENCIAS
  # ----------------------------------------------------------
  dependency-audit:
    name: "Audit · ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: lint
    if: needs.lint.result == 'success' || needs.lint.result == 'failure'

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            path: api
          - name: frontend
            path: app

    defaults:
      run:
        working-directory: ${{ matrix.path }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.path }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: npm audit — reporte JSON
        run: npm audit --json > npm-audit-report.json 2>&1 || true

      - name: npm audit — resumen
        run: npm audit --audit-level=info || true

      - name: Archivar reporte de auditoría
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-${{ matrix.name }}
          path: ${{ matrix.path }}/npm-audit-report.json
          retention-days: 14

      - name: Verificar vulnerabilidades críticas
        run: npm audit --audit-level=high

  # ----------------------------------------------------------
  # 4. SEMGREP SAST
  # ----------------------------------------------------------
  semgrep:
    name: "SAST · Semgrep"
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success' || needs.build.result == 'failure'
    permissions:
      contents: read
      security-events: write
    container:
      image: semgrep/semgrep

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix git ownership
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Semgrep Login (Cloud — condicional)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          if [ -n "$SEMGREP_APP_TOKEN" ]; then
            semgrep login
            echo "SEMGREP_AUTHENTICATED=true" >> $GITHUB_ENV
            echo "✅ Autenticado con Semgrep Cloud"
          else
            echo "SEMGREP_AUTHENTICATED=false" >> $GITHUB_ENV
            echo "ℹ️  Sin SEMGREP_APP_TOKEN — usando reglas públicas y locales únicamente"
          fi

      - name: Detectar reglas personalizadas
        id: custom_rules
        run: |
          CUSTOM_FLAG=""
          if [ -d ".semgrep/rules" ] && [ "$(ls -A .semgrep/rules 2>/dev/null)" ]; then
            CUSTOM_FLAG="--config=.semgrep/rules"
            echo "📁 Reglas personalizadas detectadas en .semgrep/rules/"
            ls .semgrep/rules/
          else
            echo "ℹ️  Sin reglas personalizadas (.semgrep/rules/ vacío o no encontrado)"
          fi
          echo "flag=$CUSTOM_FLAG" >> $GITHUB_OUTPUT

      - name: Determinar política
        id: policy
        run: |
          STRICT="false"
          BASELINE=""

          if [ "${{ github.event_name }}" = "pull_request" ] \
          && [ "${{ github.base_ref }}" = "main" ]; then
            STRICT="true"
          fi

          if [ "${{ github.ref }}" = "refs/heads/main" ] \
          || echo "${{ github.ref }}" | grep -qE '^refs/heads/release/|^refs/heads/hotfix/'; then
            STRICT="true"
          fi

          if [ "${{ github.event_name }}" = "pull_request" ] \
          && [ "${{ github.base_ref }}" = "develop" ]; then
            BASELINE="--baseline-commit=origin/develop"
          fi

          echo "strict=$STRICT"     >> $GITHUB_OUTPUT
          echo "baseline=$BASELINE" >> $GITHUB_OUTPUT

      - name: Semgrep · Backend (/api)
        id: scan_backend
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep scan \
            --verbose \
            --config=p/ci \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --config=p/typescript \
            --config=p/nodejs \
            ${{ steps.custom_rules.outputs.flag }} \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=coverage \
            --exclude='*.min.js' \
            ${{ steps.policy.outputs.baseline }} \
            --severity=ERROR \
            --sarif --output=results-backend.sarif \
            ./api || true

          FINDINGS=$(python3 -c "
          import json
          sarif = json.load(open('results-backend.sarif'))
          print(sum(len(r.get('results', [])) for r in sarif.get('runs', [])))
          ")

          echo "Findings backend: $FINDINGS"

          if [ "$FINDINGS" -gt "0" ] && [ "${{ steps.policy.outputs.strict }}" = "true" ]; then
            echo "❌ Semgrep Backend: $FINDINGS finding(s) con severidad ERROR."
            echo "👉 Code scanning: https://github.com/${{ github.repository }}/security/code-scanning"
            exit 1
          fi

      - name: Semgrep · Frontend (/app)
        id: scan_frontend
        continue-on-error: true
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          semgrep scan \
            --verbose \
            --config=p/ci \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --config=p/javascript \
            --config=p/react \
            ${{ steps.custom_rules.outputs.flag }} \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=build \
            --exclude=coverage \
            --exclude=.vite \
            --exclude=.turbo \
            --exclude=.next \
            --exclude='*.min.js' \
            ${{ steps.policy.outputs.baseline }} \
            --severity=ERROR \
            --sarif --output=results-frontend.sarif \
            ./app || true

          FINDINGS=$(python3 -c "
          import json
          sarif = json.load(open('results-frontend.sarif'))
          print(sum(len(r.get('results', [])) for r in sarif.get('runs', [])))
          ")

          echo "Findings frontend: $FINDINGS"

          if [ "$FINDINGS" -gt "0" ] && [ "${{ steps.policy.outputs.strict }}" = "true" ]; then
            echo "❌ Semgrep Frontend: $FINDINGS finding(s) con severidad ERROR."
            echo "👉 Code scanning: https://github.com/${{ github.repository }}/security/code-scanning"
            exit 1
          fi

      - name: Publicar SARIF · Backend
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results-backend.sarif
          category: semgrep-backend

      - name: Publicar SARIF · Frontend
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results-frontend.sarif
          category: semgrep-frontend

      - name: Verificar resultados · Backend
        if: always()
        run: |
          if [ "${{ steps.scan_backend.outcome }}" = "failure" ]; then
            echo "❌ El scan de Backend encontró findings con severidad ERROR en modo estricto."
            echo "👉 Code scanning: https://github.com/${{ github.repository }}/security/code-scanning"
            exit 1
          fi
          echo "✅ Scan de Backend sin findings bloqueantes."

      - name: Verificar resultados · Frontend
        if: always()
        run: |
          if [ "${{ steps.scan_frontend.outcome }}" = "failure" ]; then
            echo "❌ El scan de Frontend encontró findings con severidad ERROR en modo estricto."
            echo "👉 Code scanning: https://github.com/${{ github.repository }}/security/code-scanning"
            exit 1
          fi
          echo "✅ Scan de Frontend sin findings bloqueantes."

  # ----------------------------------------------------------
  # 5. DEPLOY FRONTEND → Vercel (producción)
  #
  #  Se activa cuando:
  #    a) push a main  Y  CI (build + semgrep) pasó correctamente
  #    b) workflow_dispatch manual desde la UI de GitHub Actions
  #
  #  Un único ambiente: production. No existen preview ni staging.
  #  Vercel maneja las env vars del frontend en su propio dashboard.
  # ----------------------------------------------------------
  deploy-frontend:
    name: "Deploy · Frontend → Vercel"
    runs-on: ubuntu-latest
    needs: [build, semgrep]
    if: |
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      ) ||
      github.event_name == 'workflow_dispatch'

    # En workflow_dispatch los jobs de CI no corren, por lo que
    # needs.build / needs.semgrep quedan en 'skipped' — esto es intencional:
    # el operador que dispara el deploy manualmente asume la responsabilidad
    # de que el código en main ya pasó el CI previamente.

    environment:
      name: production
      url: ${{ steps.deploy.outputs.preview-url }}

    steps:
      - uses: actions/checkout@v4

      - name: Registrar motivo (solo dispatch manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🖐️  Despliegue manual disparado por: ${{ github.actor }}"
          echo "📝 Motivo: ${{ github.event.inputs.reason }}"

      - name: Deploy a Vercel (production)
        id: deploy
        uses: amondnet/vercel-action@v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./app
          vercel-args: "--prod"   # siempre producción — no hay otro ambiente

      - name: Mostrar URL del despliegue
        run: |
          echo "🚀 Frontend desplegado en: ${{ steps.deploy.outputs.preview-url }}"

  # ----------------------------------------------------------
  # 6. DEPLOY BACKEND → Render (producción)
  #
  #  Render expone un Deploy Hook por servicio.
  #  Un POST al hook dispara el redeploy del servicio de producción.
  #
  #  Las env vars sensibles del backend (DB_URL, JWT_SECRET, etc.)
  #  se configuran EXCLUSIVAMENTE en el dashboard de Render
  #  (Dashboard → servicio → Environment) — nunca en el repo.
  # ----------------------------------------------------------
  deploy-backend:
    name: "Deploy · Backend → Render"
    runs-on: ubuntu-latest
    needs: [build, semgrep]
    if: |
      (
        github.event_name == 'push' &&
        github.ref == 'refs/heads/main'
      ) ||
      github.event_name == 'workflow_dispatch'

    environment:
      name: production

    steps:
      - name: Registrar motivo (solo dispatch manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          echo "🖐️  Despliegue manual disparado por: ${{ github.actor }}"
          echo "📝 Motivo: ${{ github.event.inputs.reason }}"

      - name: Disparar redeploy en Render
        run: |
          echo "🚀 Disparando deploy en Render (producción)..."
          HTTP_STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")

          if [ "$HTTP_STATUS" != "200" ] && [ "$HTTP_STATUS" != "201" ]; then
            echo "❌ Render respondió HTTP $HTTP_STATUS al recibir el hook."
            exit 1
          fi
          echo "✅ Hook aceptado por Render (HTTP $HTTP_STATUS). Build en progreso."

      # ----------------------------------------------------------
      # Health-check posterior al despliegue
      # Render tarda ~60-120 s en completar el redeploy.
      # Polling con reintentos para no fallar prematuramente.
      # Requiere que el backend exponga GET /health → 200.
      # ----------------------------------------------------------
      - name: Esperar y verificar health-check del backend
        env:
          HEALTH_URL: ${{ secrets.BACKEND_PROD_URL }}
        run: |
          echo "⏳ Esperando que Render complete el despliegue..."
          sleep 60   # pausa inicial — Render necesita tiempo para construir

          MAX_RETRIES=10
          RETRY_DELAY=15
          SUCCESS=false

          for i in $(seq 1 $MAX_RETRIES); do
            echo "🔍 Intento $i / $MAX_RETRIES — GET $HEALTH_URL/health"
            HTTP_STATUS=$(curl -o /dev/null -sS -w "%{http_code}" \
              --max-time 10 \
              "$HEALTH_URL/health" || echo "000")

            if [ "$HTTP_STATUS" = "200" ]; then
              echo "✅ Backend operativo (HTTP $HTTP_STATUS)"
              SUCCESS=true
              break
            else
              echo "⚠️  HTTP $HTTP_STATUS — reintentando en ${RETRY_DELAY}s..."
              sleep $RETRY_DELAY
            fi
          done

          if [ "$SUCCESS" != "true" ]; then
            echo "❌ El backend no respondió tras $MAX_RETRIES intentos."
            echo "   Revisa los logs en el dashboard de Render."
            exit 1
          fi

  # ----------------------------------------------------------
  # 7. SMOKE TEST POST-DEPLOY
  #
  # Valida endpoints críticos después de que ambos servicios
  # estén arriba. Si falla, el pipeline queda en rojo como señal
  # de que el despliegue requiere atención inmediata.
  # ----------------------------------------------------------
  smoke-test:
    name: "Smoke Test · Post-deploy"
    runs-on: ubuntu-latest
    needs: [deploy-frontend, deploy-backend]
    if: |
      needs.deploy-frontend.result == 'success' &&
      needs.deploy-backend.result == 'success'

    steps:
      - uses: actions/checkout@v4

      - name: Smoke test — endpoint de salud del backend
        env:
          BASE_URL: ${{ secrets.BACKEND_PROD_URL }}
        run: |
          echo "🧪 Iniciando smoke tests sobre $BASE_URL"

          check_endpoint() {
            local path=$1
            local expected=$2
            local status

            status=$(curl -o /dev/null -sS -w "%{http_code}" \
              --max-time 10 \
              "$BASE_URL$path")

            if [ "$status" = "$expected" ]; then
              echo "  ✅ $path → HTTP $status"
            else
              echo "  ❌ $path → HTTP $status (esperado: $expected)"
              return 1
            fi
          }

          # Health check del servicio de autenticación
          check_endpoint "/api/v1/auth/health" "200"

          echo "✅ Todos los smoke tests pasaron."

      - name: Resumen del despliegue
        if: always()
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            echo "🎉 Despliegue completado exitosamente."
            echo "   Disparado por : ${{ github.actor }}"
            echo "   Evento        : ${{ github.event_name }}"
            echo "   Commit        : ${{ github.sha }}"
          else
            echo "⚠️ Smoke test falló. Revisar los servicios en Vercel y Render."
          fi